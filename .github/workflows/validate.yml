name: Validate font catalog

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate catalog
        run: npm run validate
      - name: Ensure index is in sync
        run: |
          npm run build:index
          git diff --exit-code index.json || (echo "index.json out of date — run npm run build:index" && exit 1)
