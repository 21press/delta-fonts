name: Purge jsDelivr catalog

on:
  push:
    branches: [main]
    paths:
      - 'index.json'

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Purge catalog CDN cache
        run: npm run purge:cdn
