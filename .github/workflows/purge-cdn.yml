name: Purge jsDelivr catalog

on:
  push:
    branches: [main]
    paths:
      - 'index.json'
      - 'families/**'

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # index.json plus every family file the push changed (all files on a new branch).
      - name: Purge catalog CDN cache
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            npm run purge:cdn -- --all
          else
            npm run purge:cdn -- --changed "$BEFORE..$AFTER"
          fi
