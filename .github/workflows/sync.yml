name: Sync Google Fonts catalog

on:
  schedule:
    - cron: '0 4 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync catalog
        env:
          GOOGLE_FONTS_API_KEY: ${{ secrets.GOOGLE_FONTS_API_KEY }}
        run: npm run sync
      - name: Validate
        run: npm run validate
      - name: Commit if changed
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json families
          if git diff --cached --quiet; then
            echo 'No catalog changes'
            exit 0
          fi
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git commit -m "chore(catalog): sync Google Fonts"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Pushes made with GITHUB_TOKEN do not trigger other workflows, so
      # purge-cdn.yml never runs after a scheduled sync. Purge here instead.
      # index.json plus every family file the sync commit changed.
      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        run: npm run purge:cdn -- --changed ${{ steps.commit.outputs.base }}..HEAD
